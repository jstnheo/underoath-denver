# Static site, no build step. Everything is served from the repo root.
[build]
  publish = "."

# The whole app is one HTML file, and the trip data lives inside it.
# Never let a phone serve a stale copy: edits need to show up for everyone
# on the next refresh, including during the trip.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
